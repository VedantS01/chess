[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chesslab"
version = "0.1.0"
description = "Chess engine wrapper, bot framework, RL training, online play."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chesslab contributors" }]
dependencies = [
    "python-chess>=1.999",
    "numpy>=1.26",
]

[project.optional-dependencies]
rl = ["torch>=2.0"]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "docker>=7.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "build>=1.2",
]

[project.scripts]
chesslab = "chesslab.cli:main"
chesslab-runner = "chesslab.sandbox.uci_shim:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslab"]

[tool.hatch.build.targets.sdist]
include = ["src/chesslab", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "backend"]
extend-exclude = ["bot_artifacts", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
